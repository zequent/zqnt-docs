# =======================================
# CUSTOMER / PRODUCTION DEPLOYMENT MODE
# All platform services run from published container images (no local build).
# Edge adapters are optional and enabled per-adapter via --profile.
# License activation happens against the real Zequent license server
# (https://api.zequent.com by default) — no local zqnt-hub-api here.
#
# This is the customer-facing docs copy of core/docker-compose.customer.yml —
# keep both in sync if you change one.
#
# Start it with the env file used for interpolation as well, so the required
# secrets below (POSTGRES_PASSWORD, REDIS_PASSWORD) are checked before anything
# starts:
#
#   docker compose --env-file .env.customer -f docker-compose.customer.yml up -d
#
# Only the dashboard (3001) and the admin-console API (8005) are published
# (plus, opt-in, the SAPIENT sensor port -- see edge-sapient). Every other
# service -- the four internal gRPC services, Postgres, Redis, the edge
# adapters' gRPC ports, the simulator -- is reachable only inside this Compose
# network. Put a TLS
# reverse proxy in front of the two published ports for anything but a
# single-machine demo.
#
# The Java services run the `prod` profile with `docker` layered on top
# (QUARKUS_PROFILE=prod,docker): `docker` supplies the Compose-network wiring
# (static gRPC discovery, datasource, Flyway), `prod` the HTTP security headers.
# No development default (%dev signing keys, KEKs, passwords) is ever loaded.
# =======================================

name: zqnt-platform-customer

x-zequent-env: &zequent-env
  env_file:
    - .env.customer
  environment:
    QUARKUS_PROFILE: prod,docker
    # Read by every Quarkus image, including 1.3.x ones that predate the
    # REDIS_PASSWORD property.
    QUARKUS_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.customer and start with --env-file .env.customer}

services:
  # --- Infrastructure --------------------------------------------------
  # Postgres/TimescaleDB and Redis are required by every platform service.
  # Point services at your own managed Postgres/Redis instead for production.

  postgres:
    image: docker.io/timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_DB: zequent_db
      POSTGRES_USER: postgres
      # No default: choose one in .env.customer (and the same value as DATABASE_PASSWORD).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.customer and start with --env-file .env.customer}
    volumes:
      - zequent_data:/var/lib/postgresql/data
    # Not published: only the platform services on this network talk to it.
    restart: unless-stopped

  # Password-protected: Redis holds refresh tokens, revocation stamps, stream keys
  # and license leases. Every service reads the same REDIS_PASSWORD from .env.customer.
  redis:
    image: docker.io/library/redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.customer and start with --env-file .env.customer}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.customer}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    # Not published.
    restart: unless-stopped

  # --- Platform services -------------------------------------------------

  connector-service:
    <<: *zequent-env
    image: ghcr.io/zequent/connector-service:1.3.1
    pull_policy: always
    depends_on:
      - postgres
      - redis
    # Internal gRPC only -- not published (reachable inside this network).
    restart: unless-stopped

  live-data-service:
    <<: *zequent-env
    image: ghcr.io/zequent/live-data-service:1.3.1
    pull_policy: always
    depends_on:
      - connector-service
    # Internal gRPC only -- not published (reachable inside this network).
    restart: unless-stopped

  remote-control-service:
    <<: *zequent-env
    image: ghcr.io/zequent/remote-control-service:1.3.1
    pull_policy: always
    depends_on:
      - connector-service
      - live-data-service
    # Internal gRPC only -- not published (reachable inside this network).
    restart: unless-stopped

  mission-autonomy-service:
    <<: *zequent-env
    image: ghcr.io/zequent/mission-autonomy-service:1.3.1
    pull_policy: always
    depends_on:
      - connector-service
      - remote-control-service
    # Internal gRPC only -- not published (reachable inside this network).
    restart: unless-stopped

  admin-console-service:
    <<: *zequent-env
    image: ghcr.io/zequent/admin-console-service:1.3.1
    pull_policy: always
    depends_on:
      - connector-service
      - live-data-service
      - remote-control-service
      - mission-autonomy-service
    ports:
      - "8005:8005"
    restart: unless-stopped
    # Set ADMIN_CONSOLE_CORS_ORIGINS in your .env.customer to this deployment's real public dashboard
    # URL(s) (comma-separated) — the built-in default only covers localhost, which a real
    # customer domain never matches.
    # Licensing is configured once for the installation (.env: the installation bundle's public
    # key, a LICENSING_INSTALLATION_ID generated once, EXPORT_PLATFORM_KEK). Organizations are
    # licensed afterwards in the console, as system_admin: Organizations -> Create from license
    # (paste the key or drop the organization's .zqnt file) -- no restart. The platform may start
    # with no licensed organization; the system_admin can still sign in. Set
    # LICENSING_ACTIVATION_API_ENABLED=false only to lock licensing changes down.

  admin-console-ui:
    <<: *zequent-env
    # Package is zqnt-platform-console (not zqnt-admin-console-dashboard, which is
    # not a real published package — pulling it fails). It has its own version
    # line, separate from the core services' 1.3.x line.
    # Set in your .env.customer: BACKEND_ORIGIN=http://admin-console-service:8005 and
    # LICENSE_API_ORIGIN=https://api.zequent.com. Both are read at runtime by this
    # image's own server.js and silently default to localhost:8005/localhost:4000 if
    # unset — inside this container that means itself, not admin-console-service, so
    # the dashboard loads but has no working backend connection. Also set the
    # NEXT_PUBLIC_BACKEND_*_HOST vars to your real public dashboard URL — see
    # core/docs/client-sdk/CONFIGURATION.md.
    image: ghcr.io/zequent/zqnt-platform-console:v1.3.3
    pull_policy: always
    depends_on:
      - admin-console-service
    ports:
      - "3001:3000"
    restart: unless-stopped

  # --- Optional edge adapters (enable with --profile) --------------------
  # DJI, MAVLink, and Sapient have a published container image today — see
  # README.md's adapter table. RNS, Betaflight, and the AI adapter are real,
  # working code but currently source-only (`uv run`); build your own image
  # from the adapter's own Dockerfile where one exists, or see each
  # adapter's deployment guide under edge-sdk/.

  edge-dji:
    <<: *zequent-env
    # Package is zqnt-edge-adapter-dji (not dji-adapter, which is a stale,
    # abandoned package with no versioned releases).
    image: ghcr.io/zequent/zqnt-edge-adapter-dji:1.3.0
    pull_policy: always
    profiles: ["edge-dji"]
    # gRPC for remote-control only -- not published. The docks reach the adapter
    # through the MQTT broker, not through this container.
    restart: unless-stopped

  edge-mavlink:
    <<: *zequent-env
    image: ghcr.io/zequent/zqnt-adapter-mavlink:1.3.0
    pull_policy: always
    profiles: ["edge-mavlink"]
    environment:
      # The Python edge SDK takes the Redis password inside the URL.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.customer}@redis:6379
    # gRPC (50051) for remote-control only -- not published.
    restart: unless-stopped

  edge-sapient:
    <<: *zequent-env
    image: ghcr.io/zequent/zqnt-adapter-sapient:1.3.0
    pull_policy: always
    profiles: ["edge-sapient"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.customer}@redis:6379
    # SAPIENT has no authentication and no TLS: whoever reaches this port can
    # report detections as a node, and detections can start Applications. It is
    # bound to 127.0.0.1 unless you set SAPIENT_BIND_ADDR (e.g. to the LAN
    # interface the sensors are on) -- never expose it to the internet. The gRPC
    # port (50051) is for remote-control only and not published.
    ports:
      - "${SAPIENT_BIND_ADDR:-127.0.0.1}:9002:14000"
    restart: unless-stopped

  # --- Optional load-test / fleet simulator (enable with --profile) ------
  # Simulates a fleet of edge adapters against the live stack, for load-testing the Live Data
  # gRPC telemetry ingest path and exercising remote-control/admin-console fleet flows without
  # real hardware. Not part of a normal customer deployment — opt in only when you need it. See
  # simulator/README.md for the full env var reference.

  simulator:
    <<: *zequent-env
    image: ghcr.io/zequent/zqnt-simulator:1.3.3
    pull_policy: always
    profiles: ["simulator"]
    depends_on:
      - redis
      - connector-service
      - live-data-service
      - mission-autonomy-service
      - remote-control-service
    # Not published: remote-control (9190) and admin-console (9191) reach it inside
    # this network.
    restart: unless-stopped
    # Set in your .env.customer: CONNECTOR_ADDR=connector-service:8010, LIVE_DATA_ADDR=live-data-service:8003,
    # MISSION_AUTONOMY_ADDR=mission-autonomy-service:8004, REDIS_ADDR=redis:6379 (it reads
    # REDIS_PASSWORD from the same file), and
    # ADVERTISE_ADDR=simulator:9190 (must resolve from inside remote-control-service's own
    # container, not just from here — its "localhost" fallback would resolve to the wrong
    # container). DEVICE_SN defaults to SIM-DRONE-001. Set ZQNT_AUTH_ENABLED=true with
    # AUTH_PUBLIC_KEY/AUTH_EXPECTED_ISSUER matching this deployment's real signing key so
    # admin-console's fleet controls reach it securely — ZQNT_AUTH_ENABLED=false (no auth on
    # SimulatorControlService) is a local-dev-only shortcut, not for a customer deployment.

volumes:
  zequent_data:
  redis_data:
